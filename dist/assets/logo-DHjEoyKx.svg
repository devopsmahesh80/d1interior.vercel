<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-beam { fill: #F5A623; }
      .st-black { fill: #121212; }
      .st-white { fill: #FFFFFF; }
      .txt-interior { font-family: 'Montserrat', 'Inter', Arial, sans-serif; font-weight: 900; font-size: 142px; letter-spacing: 2px; }
      .txt-subtitle { font-family: 'Montserrat', 'Inter', Arial, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 14px; }
      .txt-d1 { font-family: 'Playfair Display', 'Cormorant Garamond', serif; font-weight: 800; font-size: 142px; fill: #F5A623; }
    </style>
  </defs>
  
  <!-- Yellow Cone Light Beam -->
  <polygon class="bg-beam" points="196,204 68,416 342,416" />

  <!-- Outer Architectural Tower Outline -->
  <path class="st-black" d="M 112 50 L 268 132 L 268 376 L 244 376 L 244 148 L 136 90 L 136 416 L 50 416 L 50 180 L 112 180 Z" />

  <!-- Lamp Arm & Fixture -->
  <path class="st-black" d="M 136 128 L 210 128 L 210 162 L 196 162 L 196 142 L 136 142 Z" />
  
  <!-- Lamp Shade & Bulb -->
  <path class="st-black" d="M 172 204 L 220 204 L 210 162 L 182 162 Z" />
  <circle class="bg-beam" cx="196" cy="212" r="8" />

  <!-- Inner House Roof Outline & Front Frame -->
  <path class="st-black" d="M 344 160 L 490 242 L 490 268 L 344 188 L 190 274 L 190 416 L 214 416 L 214 286 Z" />

  <!-- Window Squares (4-pane grid over the house element) -->
  <rect class="st-black" x="322" y="210" width="18" height="18" />
  <rect class="st-black" x="345" y="210" width="18" height="18" />
  <rect class="st-black" x="322" y="233" width="18" height="18" />
  <rect class="st-black" x="345" y="233" width="18" height="18" />

  <!-- Main Typography: "D1 INTERIOR" -->
  <text x="328" y="376" class="st-black txt-interior">INTERIOR</text>
  
  <!-- Subtitle: "CREATIVE DESIGN" -->
  <text x="458" y="416" class="st-black txt-subtitle">CREATIVE DESIGN</text>

  <!-- Bottom Baseline Line -->
  <rect class="st-black" x="50" y="430" width="900" height="16" rx="2" />
</svg>
